<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Quteba Lab</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;margin:0;padding:12px;background:#f4f6f8;color:#222}
.box{max-width:900px;margin:auto;background:#fff;padding:16px;border-radius:8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px}
.info label{font-size:13px;display:block}
input,select{font-family:inherit}
.info input,.info select{width:100%;padding:6px;box-sizing:border-box;font-size:15px}
.top{display:flex;gap:8px;margin-bottom:10px}
.top button{flex:1;margin:0;padding:10px 4px;font-size:15px;border:none;border-radius:6px;color:#fff;background:#555}
.top .b1{background:#2e7d32}
#pnl,#set{display:none;border:1px solid #b9d6b9;background:#f3f9f3;border-radius:6px;padding:8px;margin-bottom:12px}
#set{background:#f7f5ee;border-color:#d8cfa8}
#q,#sq{width:100%;box-sizing:border-box;padding:10px;font-size:16px;margin-bottom:6px}
#pl,#sl{max-height:55vh;overflow:auto}
details{background:#fff;border:1px solid #cde0cd;border-radius:6px;margin-bottom:6px;padding:6px 8px}
summary{font-weight:bold;font-size:15px;cursor:pointer;padding:4px 0}
#pnl label{display:block;padding:6px 0;font-size:15px}
#pnl label.all{color:#2e7d32;font-weight:bold;border-bottom:1px dashed #ccc}
#pnl input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-left:8px}
.bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bar button{flex:1;margin:0;padding:10px 6px;font-size:15px}
.add{background:#1565c0;color:#fff;border:none;border-radius:6px}
.ed{border-bottom:1px solid #eee;padding:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}
.ed b{grid-column:1/3;font-size:14px}
.ed input,.ed select{width:100%;box-sizing:border-box;padding:5px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #ccc;padding:5px;text-align:center}
th{background:#e8eef5}
td.g{background:#dde8f3;font-weight:bold;text-align:right}
td input,td select{width:80px;padding:4px;font-size:15px;text-align:center}
td input.tx,td select{width:115px}
td.pc input{width:80px}
.H{color:#c00;font-weight:bold}
.L{color:#d60;font-weight:bold}
.N{color:#080}
.tot{margin-top:12px;padding:10px;background:#fff8e1;border:1px solid #e0c060;border-radius:6px;font-size:17px;font-weight:bold;text-align:center}
.tot input{width:70px;padding:3px;text-align:center;font-size:15px}
button{padding:10px 18px;font-size:16px;margin:12px 4px 0;cursor:pointer}
.x{padding:2px 8px;margin:0;font-size:14px}
@media print{
body{background:#fff;padding:0}
.no{display:none!important}
td input,td select{border:none;width:auto;background:none;-moz-appearance:textfield;appearance:none;-webkit-appearance:none}
td input::-webkit-outer-spin-button,td input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.info input,.info select{border:none;appearance:none;-webkit-appearance:none;background:none}
.tot input{border:none}
body.hp .pc,body.hp .tot{display:none}
}
</style>
</head>

const $=id=>document.getElementById(id);
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function pr(s){
s=(s||'').trim();
if(!s)return null;
if(s[0]==='d'&&s[1]===':'){return{t:1,d:1,o:s.slice(2).split('/').filter(Boolean)};}
if(s[0]==='t'){const o=s.slice(2).split('/').filter(Boolean);return{t:1,o:o,n:o[0]||''};}
const rr=x=>x.split('-').map(Number);
if(s.indexOf('m:')===0){const o={};s.split(',').forEach(q=>{o[q[0]]=rr(q.slice(2));});return o;}
return rr(s);
}
function loadDB(){
let d=null;
try{d=JSON.parse(localStorage.getItem('qdb')||'null');}catch(e){}
if(d&&d.g&&d.t)return d;
d={g:[],t:[]};
DEF.forEach((g,gi)=>{d.g.push(g[0]);g[1].forEach(s=>{const a=s.split('|');d.t.push({c:a[0],n:a[1],u:a[2]||'',r:a[3]||'',p:+a[4]||0,g:gi});});});
return d;
}

h+='<details data-g="'+gi+'"'+(gi===0?' open':'')+'><summary>'+esc(g)+'</summary>';
h+='<label class="all"><input type="checkbox" class="ga" onchange="tg('+gi+',this.checked)"> تحديد الكل</label>';
DB.t.forEach((t,i)=>{if(t.g===gi)h+='<label class="it" data-s="'+esc((t.n+' '+t.c).toLowerCase())+'"><input type="checkbox" class="c" data-g="'+gi+'" value="'+i+'"> '+esc(t.n)+'</label>';});
h+='</details>';
});
$('pl').innerHTML=h;
}
function tp(){const p=$('pnl');const o=p.style.display==='block';p.style.display=o?'none':'block';$('set').style.display='none';if(!o){buildPick();$('q').focus();}}
function tg(gi,on){document.querySelectorAll('.c[data-g="'+gi+'"]').forEach(e=>{if(e.parentNode.style.display!=='none')e.checked=on;});}
function fl(){
const q=$('q').value.trim().toLowerCase();
document.querySelectorAll('#pl details').forEach(d=>{
let k=0;
d.querySelectorAll('.it').forEach(l=>{const m=!q||l.dataset.s.indexOf(q)>-1;l.style.display=m?'':'none';if(m)k++;});
d.style.display=k?'':'none';
d.querySelector('.all').style.display=q?'none':'';
d.open=q?true:d.dataset.g==='0';
});
}
function selVis(){document.querySelectorAll('#pl .it').forEach(l=>{if(l.style.display!=='none'&&l.parentNode.style.display!=='none')l.querySelector('input').checked=true;});}
function addSel(){
document.querySelectorAll('.c:checked').forEach(e=>{sel.add(+e.value);});
$('q').value='';
$('pnl').style.display='none';
render();
}
function rm(i){sel.delete(i);delete V[i];render();}
function rg(t){const r=pr(t.r);if(!r||r.t)return null;return Array.isArray(r)?r:r[$('sex').value];}
function stat(i){
const t=DB.t[i],s=$('s'+i),v=V[i],p=pr(t.r),r=rg(t);
let rt='—';
if(p&&p.t)rt=p.n||'—';else if(r)rt=r[0]+' - '+r[1];
$('r'+i).textContent=rt;
s.textContent='';s.className='';
if(v===undefined||v==='')return;
if(p&&p.t){
if(!p.n)return;
if(String(v).trim()===p.n){s.textContent='طبيعي';s.className='N';}else{s.textContent='غير طبيعي';s.className='H';}
return;}
if(!r)return;
const x=parseFloat(v);
if(x>r[1]){s.textContent='مرتفع ▲';s.className='H';}
else if(x<r[0]){s.textContent='منخفض ▼';s.className='L';}
else{s.textContent='طبيعي';s.className='N';}
}
function setv(i,v){V[i]=v;stat(i);}
function tot(){
let s=0;
sel.forEach(i=>{s+=parseFloat(DB.t[i].p)||0;});
$('cnt').textContent=sel.size;
$('tot').textContent=s.toLocaleString('en-US');
}
function setp(i,v){DB.t[i].p=parseFloat(v)||0;svDB();tot();}
function sc(){try{localStorage.setItem('qcur',$('cur').value);}catch(e){}}
function cell(i){
const t=DB.t[i],p=pr(t.r),v=V[i]!==undefined?V[i]:'';
if(p&&p.t&&p.o.length){
let o='<option value=""></option>';
p.o.forEach(x=>{o+='<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>';});
return '<select onchange="setv('+i+',this.value)">'+o+'</select>';
}
if(p&&p.t)return '<input type="text" class="tx" value="'+esc(v)+'" oninput="setv('+i+',this.value)">';
return '<input type="number" step="any" value="'+esc(v)+'" oninput="setv('+i+',this.value)">';
}
function render(){
let h='';
DB.g.forEach((g,gi)=>{
const items=[];
DB.t.forEach((t,i)=>{if(t.g===gi&&sel.has(i))items.push(i);});
if(!items.length)return;
h+='<tr><td class="g" colspan="7">'+esc(g)+'</td></tr>';
items.forEach(i=>{
const t=DB.t[i];
h+='<tr><td>'+esc(t.n)+'</td><td>'+cell(i)+'</td><td>'+esc(t.u)+'</td><td id="r'+i+'"></td><td id="s'+i+'"></td><td class="pc"><input type="number" step="any" min="0" value="'+esc(t.p)+'" oninput="setp('+i+',this.value)"></td><td class="no"><button class="x" onclick="rm('+i+')">✕</button></td></tr>';
});});
if(!h)h='<tr class="no"><td colspan="7">اضغط (التحاليل) لإضافة التحاليل</td></tr>';
$('tb').innerHTML=h;
sel.forEach(i=>stat(i));
tot();
}
function hp(){document.body.classList.toggle('hp',!$('shp').checked);}
function clr(){
if(!confirm('بدء مريض جديد؟'))return;
sel.clear();V={};
['pn','age','dr'].forEach(k=>{$(k).value='';});
render();
}
function ts(){const p=$('set');const o=p.style.display==='block';p.style.display=o?'none':'block';$('pnl').style.display='none';if(!o)rs();}
function rs(){
const q=$('sq').value.trim().toLowerCase();
let h='';
DB.t.forEach((t,i)=>{
if(q&&(t.n+' '+t.c).toLowerCase().indexOf(q)<0)return;
let go='';DB.g.forEach((g,gi)=>{go+='<option value="'+gi+'"'+(gi===t.g?' selected':'')+'>'+esc(g)+'</option>';});
h+='<div class="ed"><b>'+esc(t.n)+'</b>'
+'<div>الاسم<input value="'+esc(t.n)+'" onchange="up('+i+',\'n\',this.value)"></div>'
+'<div>الوحدة<input value="'+esc(t.u)+'" onchange="up('+i+',\'u\',this.value)"></div>'
+'<div>السعر<input type="number" value="'+esc(t.p)+'" onchange="up('+i+',\'p\',this.value)"></div>'
+'<div>المجموعة<select onchange="up('+i+',\'g\',this.value)">'+go+'</select></div>'
+'<div style="grid-column:1/3">المدى / الخيارات<input value="'+esc(t.r)+'" onchange="up('+i+',\'r\',this.value)"></div>'
+'<div style="grid-column:1/3"><button class="x" onclick="del('+i+')">🗑 حذف هذا التحليل</button></div></div>';
});
$('sl').innerHTML=h||'لا نتائج';
}
function up(i,k,v){
if(k==='p')v=parseFloat(v)||0;
if(k==='g')v=+v;
DB.t[i][k]=v;svDB();render();
}
function del(i){
if(!confirm('حذف هذا التحليل؟'))return;
DB.t.splice(i,1);
const ns=new Set(),nv={};
sel.forEach(x=>{if(x<i)ns.add(x);else if(x>i)ns.add(x-1);});
Object.keys(V).forEach(k=>{k=+k;if(k<i)nv[k]=V[k];else if(k>i)nv[k-1]=V[k];});
sel=ns;V=nv;svDB();rs();render();
}
function newT(){
const n=prompt('اسم التحليل الجديد:');
if(!n)return;
DB.t.push({c:'X'+Date.now(),n:n,u:'',r:'',p:0,g:0});
svDB();$('sq').value=n;rs();
alert('أُضيف في أول مجموعة. عدّل مجموعته ومداه وسعره من البطاقة.');
}
function ex(){
const b=new Blob([JSON.stringify({db:DB,cur:$('cur').value,lab:$('lab').value})],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download='quteba-lab-backup-'+new Date().toISOString().slice(0,10)+'.json';
a.click();
}
function im(f){
const file=f.files[0];if(!file)return;
const r=new FileReader();
r.onload=()=>{
try{
const d=JSON.parse(r.result);
if(!d.db||!d.db.t||!d.db.g)throw 0;
if(!confirm('سيتم استبدال الإعدادات الحالية بالنسخة. متابعة؟'))return;
DB=d.db;svDB();
$('cur').value=d.cur||'';$('lab').value=d.lab||'Quteba Lab';sc();sl();
sel.clear();V={};render();rs();
alert('تمت الاستعادة');
}catch(e){alert('ملف غير صالح');}
};
r.readAsText(file);
f.value='';
}
try{
const c=localStorage.getItem('qcur');
$('cur').value=c!==null?c:'ل.س';
const l=localStorage.getItem('qlab');
if(l)$('lab').value=l;
}catch(e){$('cur').value='ل.س';}
$('dt').valueAsDate=new Date();
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
